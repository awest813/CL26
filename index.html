<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="College Lacrosse Head Coach Sim — build your program, run the season, chase the title. Fictional teams and branding."
    />
    <meta name="theme-color" content="#102018" />
    <meta property="og:title" content="College Lacrosse Head Coach Sim" />
    <meta
      property="og:description"
      content="Dynasty-style college lacrosse coaching simulation in your browser."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>College Lacrosse Head Coach Sim</title>
    <script>
      // Apply a saved light or dark choice before first paint, so the page never flashes the other theme.
      try {
        var saved = JSON.parse(localStorage.getItem('persist:root') || '{}');
        var theme = saved.settings ? JSON.parse(saved.settings).theme : null;
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (error) {
        // No saved settings yet, or storage is blocked: the system setting applies.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
